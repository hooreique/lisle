[package]
name = "lisle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cole Sebeol and Colemak input method for IBus"
license = "MIT"
repository = "https://github.com/song/lisle"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
xkbcommon = { version = "0.9", default-features = false }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
futures-util = "0.3"
pretty_assertions = "1"
# Extra runtime features used by the in-crate peer D-Bus tests.
tokio = { version = "1", features = ["net", "time"] }
zbus = { version = "5.19", default-features = false, features = ["p2p", "tokio"] }

[profile.release]
lto = "thin"
strip = "symbols"
